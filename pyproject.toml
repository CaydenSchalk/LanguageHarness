[project]
name = "languageharness"
version = "0.1.0"
description = "Japanese conversation-practice agent harness (Ollama / OpenAI / ChatGPT) with Anki-aware target words."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "openai>=1.60",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
languageharness = "languageharness.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/languageharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
